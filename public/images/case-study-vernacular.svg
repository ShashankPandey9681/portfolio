<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Background -->
  <rect width="800" height="400" fill="#FAFAF8"/>

  <!-- Left side: Translation (complex) -->
  <g opacity="0.15">
    <!-- Scattered text lines representing multiple languages -->
    <rect x="60" y="80" width="120" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="80" y="100" width="90" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="50" y="120" width="140" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="70" y="140" width="100" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="55" y="160" width="130" height="8" rx="4" fill="#1a1a1a"/>

    <rect x="60" y="220" width="110" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="75" y="240" width="95" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="50" y="260" width="145" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="65" y="280" width="115" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="55" y="300" width="125" height="8" rx="4" fill="#1a1a1a"/>
  </g>

  <!-- Arrow from left to center: ≠ -->
  <g transform="translate(260, 185)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#C4C4C4" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="80" y="22" font-family="Georgia, serif" font-size="28" fill="#B5514E" font-weight="600">≠</text>
    <line x1="110" y1="15" x2="170" y2="15" stroke="#C4C4C4" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Right side: Comprehension (clear) -->
  <g transform="translate(480, 60)">
    <!-- Simple card with clear hierarchy -->
    <rect x="0" y="0" width="260" height="280" rx="8" fill="white" stroke="#E5E5E0" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="260" height="6" rx="3" fill="#2D6A9F" opacity="0.7"/>

    <!-- Simple icon placeholder -->
    <circle cx="40" cy="50" r="16" fill="#2D6A9F" opacity="0.12"/>
    <circle cx="40" cy="50" r="6" fill="#2D6A9F" opacity="0.4"/>

    <!-- Clear title -->
    <rect x="70" y="40" width="140" height="10" rx="5" fill="#1a1a1a" opacity="0.7"/>
    <rect x="70" y="58" width="100" height="6" rx="3" fill="#1a1a1a" opacity="0.2"/>

    <!-- Divider -->
    <line x1="24" y1="85" x2="236" y2="85" stroke="#E5E5E0" stroke-width="1"/>

    <!-- Step 1 -->
    <circle cx="40" cy="110" r="10" fill="#2D6A9F" opacity="0.15"/>
    <text x="37" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#2D6A9F" font-weight="600">1</text>
    <rect x="60" y="105" width="160" height="7" rx="3.5" fill="#1a1a1a" opacity="0.35"/>

    <!-- Step 2 -->
    <circle cx="40" cy="145" r="10" fill="#2D6A9F" opacity="0.15"/>
    <text x="37" y="149" font-family="system-ui, sans-serif" font-size="11" fill="#2D6A9F" font-weight="600">2</text>
    <rect x="60" y="140" width="130" height="7" rx="3.5" fill="#1a1a1a" opacity="0.35"/>

    <!-- Step 3 -->
    <circle cx="40" cy="180" r="10" fill="#2D6A9F" opacity="0.15"/>
    <text x="37" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#2D6A9F" font-weight="600">3</text>
    <rect x="60" y="175" width="145" height="7" rx="3.5" fill="#1a1a1a" opacity="0.35"/>

    <!-- Divider -->
    <line x1="24" y1="210" x2="236" y2="210" stroke="#E5E5E0" stroke-width="1"/>

    <!-- Action button -->
    <rect x="24" y="230" width="100" height="30" rx="6" fill="#2D6A9F" opacity="0.85"/>
    <rect x="44" y="242" width="60" height="6" rx="3" fill="white" opacity="0.9"/>
  </g>

  <!-- Labels -->
  <text x="120" y="370" font-family="system-ui, sans-serif" font-size="13" fill="#999" text-anchor="middle" letter-spacing="0.08em">TRANSLATION</text>
  <text x="610" y="370" font-family="system-ui, sans-serif" font-size="13" fill="#2D6A9F" text-anchor="middle" letter-spacing="0.08em">COMPREHENSION</text>
</svg>
